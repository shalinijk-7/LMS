{% extends 'base.html' %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/courses.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<div class="form-container-premium fade-in slide-up" style="margin-top: 100px;">
    <h2 style="margin-bottom: 2rem; color: var(--primary);">Create New Course</h2>
    
    <form method="POST" action="{{ url_for('courses.create_course') }}">
        <div class="form-group">
            <label for="title">Course Title</label>
            <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Complete Web Development Bootcamp" required>
        </div>
        
        <div class="form-group">
            <label for="description">Course Description</label>
            <textarea id="description" name="description" class="form-control" placeholder="Describe what students will learn..." required></textarea>
        </div>
        
        <div class="form-group">
            <label for="price">Price ($)</label>
            <input type="number" step="0.01" id="price" name="price" class="form-control" placeholder="0.00" value="0.00" required>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-primary btn-lg">Publish Course</button>
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline btn-lg">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
