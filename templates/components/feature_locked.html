{% extends 'dashboard_base.html' %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="card border-0 shadow-lg rounded-4 text-center p-5" style="max-width: 500px; background: linear-gradient(to bottom, #ffffff, #f8f9fa);">
        <div class="mb-4">
            <div class="d-inline-flex justify-content-center align-items-center bg-danger bg-opacity-10 text-danger rounded-circle" style="width: 80px; height: 80px;">
                <i class="bi bi-lock-fill fs-1"></i>
            </div>
        </div>
        <h3 class="fw-bold text-dark mb-3">This feature is locked.</h3>
        
        <p class="text-muted fs-5 mb-4">
            {% if message %}
                {{ message }}
            {% else %}
                Your free trial has limited access.<br>Subscribe now to unlock this feature.
            {% endif %}
        </p>
        
        <div class="d-flex justify-content-center gap-3 mt-2">
            <a href="{{ url_for('subscription.plans') }}" class="btn btn-primary rounded-pill px-4 py-2 fw-bold shadow-sm pulse-hover">View Plans</a>
            <button onclick="history.back()" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold shadow-sm">Maybe Later</button>
        </div>
    </div>
</div>
{% endblock %}
