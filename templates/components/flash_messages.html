{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="toast-container-premium position-fixed top-0 end-0 p-3 mt-5" style="z-index: 1090;">
            {% for category, message in messages %}
                <div class="toast align-items-center text-bg-{{ category }} border-0 show" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="5000">
                    <div class="d-flex">
                        <div class="toast-body fw-medium">
                            {{ message }}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                </div>
            {% endfor %}
        </div>
        
        <script>
            // Initialize toasts
            document.addEventListener('DOMContentLoaded', function () {
                var toastElList = [].slice.call(document.querySelectorAll('.toast'))
                var toastList = toastElList.map(function (toastEl) {
                    return new bootstrap.Toast(toastEl)
                });
                toastList.forEach(toast => toast.show());
            });
        </script>
    {% endif %}
{% endwith %}
