<!-- Template for create assignment view. -->
{% extends 'dashboard_base.html' %}

{% block title %}Create Assignment - LMS Premium{% endblock %}

{% block content %}
<div class="dashboard-header">
    <div class="header-info">
        <h1>Create Assignment</h1>
        <p>Course: {{ course.title }}</p>
    </div>
</div>

<div class="glass-card" style="padding: 2rem;">
    <form method="POST" action="{{ url_for('instructor.create_assignment', course_id=course.id) }}">
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="title" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Assignment Title</label>
            <input type="text" id="title" name="title" class="form-control" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main);" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="description" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Description & Instructions</label>
            <textarea id="description" name="description" rows="5" class="form-control" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main);" required></textarea>
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="deadline" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Deadline</label>
            <input type="datetime-local" id="deadline" name="deadline" class="form-control" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main);" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 2rem;">
            <label for="total_marks" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Total Marks</label>
            <input type="number" id="total_marks" name="total_marks" class="form-control" style="width: 100%; padding: 0.75rem; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main);" min="1" required>
        </div>
        
        <button type="submit" class="btn btn-primary pulse-hover">Create Assignment</button>
        <a href="{{ url_for('instructor.dashboard') }}" class="btn btn-outline" style="margin-left: 1rem;">Cancel</a>
    </form>
</div>
{% endblock %}
