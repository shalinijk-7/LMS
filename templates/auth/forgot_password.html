<!-- Template for forgot password view. -->
{% extends "base.html" %}

{% block title %}Forgot Password - LearnSphere AI{% endblock %}

{% block content %}
<div class="container-premium d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card glass-card p-4 p-md-5" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: var(--primary);">Forgot Password?</h2>
            <p class="text-muted">Enter your email and we'll send you a link to reset your password.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="mb-4">
                <label for="email" class="form-label fw-medium">Email Address</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Send Reset Link</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-medium text-muted"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
