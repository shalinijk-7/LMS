<!-- Template for reset password view. -->
{% extends "base.html" %}

{% block title %}Reset Password - LearnSphere AI{% endblock %}

{% block content %}
<div class="container-premium d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card glass-card p-4 p-md-5" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: var(--primary);">Set New Password</h2>
            <p class="text-muted">Please enter your new password below.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
            <div class="mb-4">
                <label for="password" class="form-label fw-medium">New Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create a new password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
