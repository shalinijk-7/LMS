{% extends "base.html" %}

{% block title %}Register - LearnSphere AI{% endblock %}

{% block content %}
<div class="container-premium d-flex justify-content-center align-items-center py-5" style="min-height: 80vh;">
    <div class="card glass-card p-4 p-md-5" style="max-width: 500px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="fw-bold" style="color: var(--primary);">Join LearnSphere AI</h2>
            <p class="text-muted">Create an account to unlock your potential.</p>
        </div>
        
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label for="name" class="form-label fw-medium">Full Name</label>
                <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-medium">Email Address</label>
                <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="name@example.com" required>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-medium">Password</label>
                <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Create a strong password" required>
            </div>
            
            <div class="mb-4">
                <label for="role" class="form-label fw-medium">I want to join as</label>
                <select class="form-select form-select-lg" id="role" name="role" required>
                    <option value="student" selected>Student</option>
                    <option value="instructor">Instructor</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Create Account</button>
            
            <div class="d-flex align-items-center my-4">
                <hr class="flex-grow-1">
                <span class="mx-3 text-muted small fw-medium">OR</span>
                <hr class="flex-grow-1">
            </div>
            
            <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline-dark btn-lg w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" width="20" height="20">
                Sign up with Google
            </a>
        </form>
        
        <div class="text-center mt-3">
            <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-medium">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
